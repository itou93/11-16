<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>越総 ARナビ - AR コシソウGO</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #d8b4fe 0%, #c7d2fe 45%, #7dd3fc 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            perspective: 1000px;
        }

        /* 浮遊背景パーツ（5学科モチーフ） */
        .bg-decorations {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .decor-item {
            position: absolute;
            color: rgba(255, 255, 255, 0.42);
            animation: float 6s ease-in-out infinite alternate;
        }

        .item-kougyou1    { top: 4%; left: 6%; animation-delay: 0s; font-size: 46px; }
        .item-kougyou2    { bottom: 5%; right: 8%; animation-delay: 2s; font-size: 42px; }
        .item-shougyou1   { top: 6%; right: 7%; animation-delay: 1s; font-size: 44px; }
        .item-shougyou2   { bottom: 18%; left: 5%; animation-delay: 3s; font-size: 38px; }
        .item-fukushoku1  { top: 45%; left: 3%; animation-delay: 1.5s; font-size: 42px; }
        .item-fukushoku2  { bottom: 4%; right: 26%; animation-delay: 0.5s; font-size: 38px; }
        .item-shokumotsu1 { top: 48%; right: 4%; animation-delay: 2.5s; font-size: 46px; }
        .item-shokumotsu2 { top: 5%; left: 28%; animation-delay: 1.8s; font-size: 38px; }
        .item-ar1         { bottom: 6%; left: 20%; animation-delay: 0.8s; font-size: 44px; }
        .item-ar2         { top: 3%; right: 26%; animation-delay: 2.2s; font-size: 36px; }

        @keyframes float {
            0%   { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-16px) rotate(10deg); }
        }

        /* メインカード（配置そのまま・立体感強化） */
        .app-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 28px;
            padding: 28px 20px 26px;
            width: 100%;
            max-width: 440px;
            box-shadow:
                0 22px 45px rgba(15, 23, 42, 0.16),
                0 6px 0 rgba(226, 232, 240, 0.9),
                inset 0 2px 0 rgba(255, 255, 255, 1);
            text-align: center;
            transform-style: preserve-3d;
        }

        /* ヘッダー */
        .app-header {
            margin-bottom: 22px;
        }

        .app-badge {
            display: inline-block;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 12px;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 999px;
            border: 1px solid #c7d2fe;
            margin-bottom: 10px;
            letter-spacing: 0.04em;
            box-shadow: 0 2px 0 #c7d2fe;
        }

        .app-title {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #1e293b 25%, #2563eb 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .app-subtitle {
            font-size: 14px;
            color: #475569;
            font-weight: 700;
            margin-top: 6px;
        }

        /* 3D立体ボタン共通（厚み＋上面ハイライト＋物理押し込み） */
        .btn-3d {
            position: relative;
            border: none;
            cursor: pointer;
            user-select: none;
            transform: translateY(0);
            transition: transform 0.08s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.08s ease;
        }

        /* メインARボタン共通（VPS・机上で体験） */
        .btn-main-ar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 15px 18px;
            border-radius: 20px;
            text-decoration: none;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .btn-main-left {
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
        }

        .btn-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.22);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.35), 0 2px 4px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .btn-main-title {
            display: block;
            font-size: 18px;
            font-weight: 900;
            line-height: 1.2;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
        }

        .btn-main-desc {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.92);
            margin-top: 3px;
        }

        /* 1. VPS（3D立体グリーン） */
        .btn-vps {
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            box-shadow:
                0 6px 0 #047857,
                0 12px 20px rgba(4, 120, 87, 0.32),
                inset 0 2px 1px rgba(255, 255, 255, 0.45);
        }
        .btn-vps:active {
            transform: translateY(5px);
            box-shadow:
                0 1px 0 #047857,
                0 4px 8px rgba(4, 120, 87, 0.25),
                inset 0 2px 1px rgba(255, 255, 255, 0.3);
        }

        /* 2. 机上で体験（3D立体オレンジ） */
        .btn-desk {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            box-shadow:
                0 6px 0 #b45309,
                0 12px 20px rgba(180, 83, 9, 0.30),
                inset 0 2px 1px rgba(255, 255, 255, 0.45);
        }
        .btn-desk:active {
            transform: translateY(5px);
            box-shadow:
                0 1px 0 #b45309,
                0 4px 8px rgba(180, 83, 9, 0.25),
                inset 0 2px 1px rgba(255, 255, 255, 0.3);
        }

        /* 3. クイズ & 4. アンケート */
        .sub-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 15px 12px;
            border-radius: 18px;
            text-decoration: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
        }

        .btn-tile i {
            font-size: 22px;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.15));
        }

        /* クイズ（3D立体パープル） */
        .btn-quiz {
            background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%);
            box-shadow:
                0 6px 0 #5b21b6,
                0 10px 18px rgba(91, 33, 182, 0.28),
                inset 0 2px 1px rgba(255, 255, 255, 0.45);
        }
        .btn-quiz:active {
            transform: translateY(5px);
            box-shadow:
                0 1px 0 #5b21b6,
                0 4px 8px rgba(91, 33, 182, 0.22),
                inset 0 2px 1px rgba(255, 255, 255, 0.3);
        }

        /* アンケート（3D立体レッド） */
        .btn-survey {
            background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
            box-shadow:
                0 6px 0 #b91c1c,
                0 10px 18px rgba(185, 28, 28, 0.28),
                inset 0 2px 1px rgba(255, 255, 255, 0.45);
        }
        .btn-survey:active {
            transform: translateY(5px);
            box-shadow:
                0 1px 0 #b91c1c,
                0 4px 8px rgba(185, 28, 28, 0.22),
                inset 0 2px 1px rgba(255, 255, 255, 0.3);
        }

        /* 5. 使い方ボタン（3D立体ライトグレー） */
        .btn-usage {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px 16px;
            font-size: 14px;
            font-weight: 800;
            border-radius: 16px;
            background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
            color: #475569;
            box-shadow:
                0 5px 0 #cbd5e1,
                0 8px 14px rgba(100, 116, 139, 0.16),
                inset 0 2px 1px rgba(255, 255, 255, 0.9);
        }
        .btn-usage:active {
            transform: translateY(4px);
            box-shadow:
                0 1px 0 #cbd5e1,
                0 3px 6px rgba(100, 116, 139, 0.14);
        }

        /* 使い方アコーディオン */
        .guide-box {
            display: none;
            margin-top: 16px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            text-align: left;
            font-size: 13px;
            color: #334155;
            line-height: 1.65;
            box-shadow: inset 0 2px 4px rgba(15, 23, 42, 0.04);
        }

        .guide-box h4 {
            color: #0f172a;
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .guide-box ol {
            padding-left: 20px;
        }

        .guide-box li {
            margin-bottom: 6px;
        }

        .guide-box li:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="bg-decorations">
        <i class="fa-solid fa-gear decor-item item-kougyou1"></i>
        <i class="fa-solid fa-screwdriver-wrench decor-item item-kougyou2"></i>
        <i class="fa-solid fa-calculator decor-item item-shougyou1"></i>
        <i class="fa-solid fa-chart-line decor-item item-shougyou2"></i>
        <i class="fa-solid fa-scissors decor-item item-fukushoku1"></i>
        <i class="fa-solid fa-shirt decor-item item-fukushoku2"></i>
        <i class="fa-solid fa-utensils decor-item item-shokumotsu1"></i>
        <i class="fa-solid fa-cake-candles decor-item item-shokumotsu2"></i>
        <i class="fa-solid fa-vr-cardboard decor-item item-ar1"></i>
        <i class="fa-solid fa-graduation-cap decor-item item-ar2"></i>
    </div>
    
    <div class="app-card">
        <div class="app-header">
            <span class="app-badge">越谷総合技術高校</span>
            <h1 class="app-title">AR コシソウGO</h1>
            <p class="app-subtitle">校内をめぐってARを体験しよう！</p>
        </div>

        <!-- 1. VPS -->
        <a href="./vps.html" class="btn-3d btn-main-ar btn-vps">
            <div class="btn-main-left">
                <div class="btn-icon-box">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <div>
                    <span class="btn-main-title">VPS</span>
                    <span class="btn-main-desc">校内のスポットにかざしてAR起動</span>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right" style="opacity: 0.9;"></i>
        </a>

        <!-- 2. 机上で体験 -->
        <a href="./deskar.html" class="btn-3d btn-main-ar btn-desk">
            <div class="btn-main-left">
                <div class="btn-icon-box">
                    <i class="fa-solid fa-camera"></i>
                </div>
                <div>
                    <span class="btn-main-title">机上で体験</span>
                    <span class="btn-main-desc">目の前に3Dキャラを呼び出して撮影</span>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right" style="opacity: 0.9;"></i>
        </a>

        <!-- 3. クイズ & 4. アンケート -->
        <div class="sub-grid">
            <a href="./form.html" class="btn-3d btn-tile btn-quiz">
                <i class="fa-solid fa-circle-question"></i>
                <span>クイズ</span>
            </a>

            <a href="https://forms.gle/NvS4azoim9Pduo2w6" class="btn-3d btn-tile btn-survey">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>アンケート</span>
            </a>
        </div>

        <!-- 5. 使い方 -->
        <button type="button" class="btn-3d btn-usage" id="toggleGuide">
            <i class="fa-solid fa-circle-info"></i>
            <span>使い方</span>
            <i class="fa-solid fa-chevron-down" id="guideChevron" style="font-size: 12px; margin-left: 2px;"></i>
        </button>

        <div class="guide-box" id="guideBox">
            <h4><i class="fa-solid fa-circle-info" style="color: #3b82f6;"></i> アプリのあそびかた</h4>
            <ol>
                <li><strong>「VPS」</strong>または<strong>「机上で体験」</strong>を押してカメラを許可します。</li>
                <li>校内の対象スポットにカメラをかざしたり、机の上にキャラクターを呼び出して記念撮影ができます。</li>
                <li>ARとは別に校内を使った<strong>クイズ</strong>があります。ぜひ全問正解を目指して頑張ってください。</li>
            </ol>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('toggleGuide');
        const guideBox = document.getElementById('guideBox');
        const guideChevron = document.getElementById('guideChevron');

        toggleBtn.addEventListener('click', () => {
            const isOpen = guideBox.style.display === 'block';
            guideBox.style.display = isOpen ? 'none' : 'block';
            guideChevron.className = isOpen ? 'fa-solid fa-chevron-down' : 'fa-solid fa-chevron-up';
        });
    </script>
</body>
</html>
